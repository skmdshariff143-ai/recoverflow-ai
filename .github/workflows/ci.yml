name: CI

on:
  push:
    branches: [main, 'feat/*', 'release/*', 'milestone/*', 'verify/*', 'fix/*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-unit:
    name: Quality & Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/core/prisma/schema.prisma

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Offline Agent Evaluation Harness
        run: npm run eval:agents

      - name: Run Artifact Verification
        run: npm run verify:artifacts

  durability-integration:
    name: Real Infrastructure Durability (PostgreSQL 16 & Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recoverflow
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: recoverflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/core/prisma/schema.prisma

      - name: Validate Prisma schema definition
        env:
          DATABASE_URL: postgresql://recoverflow:password123@localhost:5432/recoverflow_test?schema=public
        run: npx prisma validate --schema=packages/core/prisma/schema.prisma

      - name: Deploy Prisma migrations to empty PostgreSQL from scratch
        env:
          DATABASE_URL: postgresql://recoverflow:password123@localhost:5432/recoverflow_test?schema=public
        run: npx prisma migrate deploy --schema=packages/core/prisma/schema.prisma

      - name: Run PostgreSQL Integration Tests (Fail-Closed)
        env:
          DATABASE_URL: postgresql://recoverflow:password123@localhost:5432/recoverflow_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run test:integration:postgres

      - name: Run Redis Integration Tests (Fail-Closed)
        env:
          DATABASE_URL: postgresql://recoverflow:password123@localhost:5432/recoverflow_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run test:integration:redis

      - name: Run End-to-End Durability Integration Tests
        env:
          DATABASE_URL: postgresql://recoverflow:password123@localhost:5432/recoverflow_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run test:durability

  e2e-build:
    name: Build & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/core/prisma/schema.prisma

      - name: Build Next.js production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
