# Local infrastructure. Use managed services and secret storage for deployment.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recoverflow_local_only}
      POSTGRES_DB: recoverflow
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d recoverflow']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
  # Optional web container. Default compose starts infrastructure only.
  web:
    profiles: ['console']
    build: .
    init: true
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      RECOVERFLOW_RUNTIME_MODE: SANDBOX
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-recoverflow_local_only}@postgres:5432/recoverflow
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
    command: ['sh', '-c', 'npm run db:migrate:deploy && npm start']
    ports: ['127.0.0.1:3000:3000']
volumes:
  postgres_data:
  redis_data:
